<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NutriGen — Beta Access</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=DM+Sans:opsz,wght@9..40,300..700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5efe6;
    --bg-elev: #fbf7f0;
    --ink: #1f1a14;
    --ink-soft: #5a4f42;
    --ink-muted: #8c8276;
    --line: #e6dcc9;
    --line-strong: #c9bda5;
    --sage: #3d5a3d;
    --sage-deep: #2a4129;
    --terracotta: #b85742;
    --terracotta-soft: #d68b75;
    --gold: #c4954a;
    --cream-card: #fdfaf3;
    --shadow-sm: 0 1px 2px rgba(31,26,20,.05), 0 2px 8px rgba(31,26,20,.04);
    --shadow-md: 0 4px 16px rgba(31,26,20,.08), 0 12px 32px rgba(31,26,20,.06);
    --shadow-lg: 0 20px 48px rgba(31,26,20,.18);
    --radius-sm: 4px;
    --radius-md: 10px;
    --radius-lg: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background-image:
      radial-gradient(circle at 12% 8%, rgba(196,149,74,.08), transparent 45%),
      radial-gradient(circle at 88% 95%, rgba(61,90,61,.07), transparent 50%);
  }
  .display { font-family: 'Fraunces', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }

  .card {
    width: 100%;
    max-width: 400px;
    background: var(--cream-card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: 40px 36px;
    text-align: center;
  }
  .brand-mark {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--sage);
    color: var(--bg);
    display: grid;
    place-items: center;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 24px;
    font-weight: 500;
    margin: 0 auto 20px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    letter-spacing: -0.01em;
    margin-bottom: 8px;
  }
  .sub {
    color: var(--ink-soft);
    font-size: 14.5px;
    margin-bottom: 28px;
  }
  input[type="password"] {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-md);
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg-elev);
    color: var(--ink);
    margin-bottom: 18px;
    text-align: center;
    letter-spacing: 0.04em;
  }
  input:focus { outline: none; border-color: var(--sage); }
  .btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 500;
    padding: 15px 28px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .15s ease, background .2s ease, box-shadow .2s ease;
    width: 100%;
    background: var(--ink);
    color: var(--bg);
  }
  .btn:hover { background: var(--sage-deep); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .error-text {
    color: var(--terracotta);
    font-size: 13px;
    margin-top: 14px;
    display: none;
  }
  .error-text.show { display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-mark">N</div>
    <h1 class="display">Beta preview</h1>
    <p class="sub">NutriGen is in private beta. Enter the access code to continue.</p>
    <input type="password" id="pwd" placeholder="Access code" autocomplete="off" />
    <button class="btn" onclick="checkPassword()">Continue</button>
    <p class="error-text" id="error">Incorrect access code. Please try again.</p>
  </div>
  <script>
    function checkPassword() {
      const pwd = document.getElementById('pwd').value;
      if (pwd === 'NutriGen2026') {
        sessionStorage.setItem('nutrigen_auth', 'granted');
        window.location.href = '/landing.html';
      } else {
        document.getElementById('error').classList.add('show');
      }
    }
    document.getElementById('pwd').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
  </script>
</body>
</html>
